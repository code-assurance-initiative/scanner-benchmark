name: Benchmark challenge
# Runs every day and performs whatever milestone of a window in challenge/calendar.json has come due and is not yet
# recorded in challenge/state.json: announce (>= 30 days before), close registration, open, reveal. A missed day is
# caught up on the next run; nothing is done twice.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
permissions:
  contents: write
  issues: write
  discussions: write
concurrency:
  group: challenge
  cancel-in-progress: false
jobs:
  milestones:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Calendar is valid
        run: python3 -m tools.challenge validate
      - name: Perform due milestones
        run: |
          set -euo pipefail
          python3 -m tools.challenge due > due.txt
          if [ ! -s due.txt ]; then echo "nothing due"; exit 0; fi
          git config user.name "challenge-bot"
          git config user.email "challenge-bot@users.noreply.github.com"
          while read -r action window; do
            echo "== $action $window"
            title_open="Challenge $window: registration open"
            case "$action" in
              announce)
                python3 -m tools.challenge render "$window" --out "challenge/announcements/$window"
                repo_id=$(gh api graphql -f query='query($o:String!,$n:String!){repository(owner:$o,name:$n){id discussionCategories(first:20){nodes{id name}}}}' -f o="${REPO%/*}" -f n="${REPO#*/}" --jq '.data.repository.id')
                cat_id=$(gh api graphql -f query='query($o:String!,$n:String!){repository(owner:$o,name:$n){discussionCategories(first:20){nodes{id name}}}}' -f o="${REPO%/*}" -f n="${REPO#*/}" --jq '.data.repository.discussionCategories.nodes[] | select(.name=="Announcements") | .id')
                gh api graphql -f query='mutation($r:ID!,$c:ID!,$t:String!,$b:String!){createDiscussion(input:{repositoryId:$r,categoryId:$c,title:$t,body:$b}){discussion{url}}}' \
                  -f r="$repo_id" -f c="$cat_id" -f t="$title_open" -f b="$(cat challenge/announcements/$window/announcement.md)" --jq '.data.createDiscussion.discussion.url'
                url=$(gh issue create --title "$title_open" --label challenge --body-file "challenge/announcements/$window/announcement.md")
                gh issue pin "$url" || true
                { echo "LinkedIn text, ready to post:"; echo; echo '```'; cat "challenge/announcements/$window/linkedin.txt"; echo; echo '```'; } > linkedin-comment.md
                gh issue comment "$url" --body-file linkedin-comment.md
                { echo "### LinkedIn text for $window"; echo '```'; cat "challenge/announcements/$window/linkedin.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
                ;;
              close-registration)
                n=$(gh issue list --label challenge --state open --search "\"$title_open\" in:title" --json number --jq '.[0].number')
                [ -n "$n" ] && gh issue comment "$n" --body "Registration for $window is now closed. Registered engines, configurations and mappings are frozen."
                ;;
              open|reveal)
                gh issue create --label challenge --title "Challenge $window: $action today" --body "The $action step of window $window is due today. Procedure: docs/CHALLENGE-RUN.md. This step is run by the operators; its results are published in this repository."
                ;;
            esac
            python3 -m tools.challenge record "$action" "$window"
          done < due.txt
          git add challenge
          git commit -m "challenge: $(tr '\n' ' ' < due.txt)" || true
          git push
